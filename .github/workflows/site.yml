name: build-site

on:
  push:
    branches: [main]
    paths:
      - "guides/**"
      - "lessons/**"
      - "decisions/**"
      - "templates/**"
      - "projects/**"
      - "README.md"
      - "build_site.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build_site.py가 git log로 문서별 갱신일을 뽑는다

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build content index
        run: |
          set -euo pipefail
          python build_site.py

      - name: Commit index
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/content.json
          if git diff --cached --quiet; then echo "변경 없음 - 커밋 생략"; exit 0; fi
          git commit -m "docs: 콘텐츠 인덱스 재생성"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((i * 5))
          done
          echo "::error::3회 시도 후에도 푸시 실패"; exit 1
